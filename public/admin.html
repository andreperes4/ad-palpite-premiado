<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AD • Painel Administrador</title><link rel="stylesheet" href="/style.css"></head><body><div class="bg"></div><section id="login" class="card login"><div class="brand"><span class="ad">AD</span></div><h2>PAINEL ADMINISTRADOR</h2><div class="field"><label>Senha do ADM</label><input id="password" type="password" class="input"></div><button id="enter" class="btn primary" style="margin-top:12px">ENTRAR</button><div id="loginmsg" class="notice"></div></section><main id="panel" class="admin hidden"><div class="topbar"><div class="brand"><span class="ad">AD</span><span style="font-size:18px;letter-spacing:0">PAINEL ADMINISTRADOR</span></div><button id="logout" class="btn danger mini">Sair</button></div><h1 class="sectiontitle">RODADA ATUAL</h1><section class="card"><h3>🎁 INFORMAÇÕES DA RODADA</h3><div class="admin-grid"><div class="field"><label>Título da rodada</label><input id="title" class="input" placeholder="Ex.: Rodada 1 - Futsal"></div><div class="field"><label>Prêmio (PIX)</label><input id="prizeA" class="input" placeholder="R$ 100,00"></div><div class="field"><label>Encerramento automático</label><input id="closes" type="datetime-local" class="input"></div></div></section><div class="game-tools"><h2>⚽ JOGOS DA RODADA</h2><button id="addgame" class="btn primary mini">＋ ADICIONAR JOGO</button></div><div id="adminGames"></div><div class="actions"><button id="save" class="btn green">💾 SALVAR RODADA</button><a href="/" target="_blank" class="btn blue linkbtn">↗ VISUALIZAR PÁGINA</a><button id="newround" class="btn danger">🗑 NOVA RODADA</button></div><section class="card lock"><h3>🔒 BLOQUEAR PALPITES</h3><p class="muted">Após bloquear, ninguém poderá cadastrar ou alterar.</p><button id="lock" class="btn danger">BLOQUEAR AGORA</button></section><section class="card"><h3>🏆 RESULTADOS DOS JOGOS</h3><div id="results"></div><button id="result" class="btn primary" style="margin-top:12px">VERIFICAR GANHADOR</button><div id="adminmsg" class="notice"></div></section><section class="card"><h3>👥 PARTICIPANTES (<span id="count">0</span>)</h3><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section></main><script src="/admin.js"></script></body></html>
